openapi: 3.1.0
info:
  title: Granthalay API
  version: v1
  description: |-
    Contract for optional connected Granthalay features. The local-only reader does not depend on
    this API. New fields may be added to responses without a version change; clients must ignore
    unknown fields. Removing or renaming fields, changing their meaning, or tightening accepted
    input requires a new API version or a documented migration window.
servers:
  - url: /
tags:
  - name: Contract
    description: API discovery and contract metadata.
  - name: Identity
    description: User account registration, email verification, and session sign-in.
paths:
  /api/v1:
    get:
      tags: [Contract]
      operationId: getApiIndex
      summary: Discover the current API contract
      security: []
      responses:
        '200':
          description: Version and OpenAPI document location.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiIndex'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/register:
    post:
      tags: [Identity]
      operationId: registerAccount
      summary: Register a new email/password account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Registration request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/verify-email:
    post:
      tags: [Identity]
      operationId: verifyEmail
      summary: Verify account email address with verification token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Email address verified and account activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/sign-in:
    post:
      tags: [Identity]
      operationId: signIn
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Signed in successfully. Session cookie established.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/sign-out:
    post:
      tags: [Identity]
      operationId: signOut
      summary: Sign out and invalidate current session
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Signed out successfully.
        '401':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/revoke-sessions:
    post:
      tags: [Identity]
      operationId: revokeAllSessions
      summary: Revoke all active sessions for current user
      security:
        - sessionCookie: []
      responses:
        '204':
          description: All sessions revoked successfully.
        '401':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/request-password-reset:
    post:
      tags: [Identity]
      operationId: requestPasswordReset
      summary: Request password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPasswordResetRequest'
      responses:
        '202':
          description: Password reset request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/reset-password:
    post:
      tags: [Identity]
      operationId: resetPassword
      summary: Reset account password using token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/me:
    get:
      tags: [Identity]
      operationId: getCurrentAccount
      summary: Fetch currently authenticated user account
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current account details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: Revocable browser session. Browser requests include credentials.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      description: Zero-based page number.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Requested page size, capped by the endpoint.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Problem:
      description: Request failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationProblem:
      description: Request validation failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
  schemas:
    ApiIndex:
      type: object
      additionalProperties: false
      required: [name, version, openapi]
      properties:
        name:
          type: string
          example: Granthalay API
        version:
          type: string
          const: v1
        openapi:
          type: string
          format: uri-reference
          example: /openapi/granthalay-api-v1.yaml
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: reader@example.com
        password:
          type: string
          minLength: 8
          maxLength: 128
          example: SecureP@ssw0rd!
    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    SignInRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: reader@example.com
        password:
          type: string
          example: SecureP@ssw0rd!
    RequestPasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: reader@example.com
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token:
          type: string
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
          example: NewSecureP@ssw0rd!
    AccountResponse:
      type: object
      additionalProperties: false
      required: [id, email, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        email:
          type: string
          format: email
          example: reader@example.com
        status:
          type: string
          enum: [PENDING_VERIFICATION, ACTIVE, DISABLED]
          example: ACTIVE
        createdAt:
          type: string
          format: date-time
          example: '2026-09-05T12:00:00Z'
    MessageResponse:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          example: Verification link has been sent if eligible.
    PageMetadata:
      type: object
      additionalProperties: false
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int32
          minimum: 0
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        requestId:
          type: string
          description: Safe correlation identifier when one is available.
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
          description: Stable machine-readable validation code.
        message:
          type: string
          description: Safe human-readable explanation; rejected values are omitted.
