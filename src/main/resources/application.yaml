spring:
  application:
    name: granthalay
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
  session:
    jdbc:
      initialize-schema: never
  flyway:
    clean-disabled: true
  modulith:
    events:
      completion-mode: update
  mvc:
    problemdetails:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

granthalay:
  web:
    allowed-origins: ${GRANTHALAY_WEB_ALLOWED_ORIGINS:https://samsterzero.github.io}
