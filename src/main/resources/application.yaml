spring:
  application:
    name: granthalay
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        name: SESSION
        http-only: true
        secure: ${GRANTHALAY_SESSION_COOKIE_SECURE:false}
        same-site: lax
  flyway:
    clean-disabled: true
  modulith:
    events:
      completion-mode: update
  mvc:
    problemdetails:
      enabled: true
  web:
    error:
      include-binding-errors: never
      include-message: never
      include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

granthalay:
  web:
    allowed-origins: ${GRANTHALAY_WEB_ALLOWED_ORIGINS:https://samsterzero.github.io}
